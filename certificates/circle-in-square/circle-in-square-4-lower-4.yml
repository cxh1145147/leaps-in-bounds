notes: Shifting the centers by (-2, -2) when s < 4 places them in [-1, 1]^2 at pairwise squared distance at least 4. Partitioning [-1, 1]^2 into four quadrants forces one center into each quadrant, and summing the four cyclic neighbor squared distances gives a contradiction. Formalized with AI assistance (GPT-6.2 Astra and Gemini 4 Neon).
